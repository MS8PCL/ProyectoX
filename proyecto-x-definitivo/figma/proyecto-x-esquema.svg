<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .bg{fill:#0b0d10;}
      .panel{fill:#0f1318;stroke:#2b3340;stroke-width:2;}
      .title{fill:#e8edf2;font:700 28px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;}
      .h{fill:#e8edf2;font:700 18px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;}
      .t{fill:#c6d0db;font:400 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;}
      .muted{fill:#8ea0b2;font:400 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;}
      .arrow{stroke:#8ea0b2;stroke-width:2;fill:none;marker-end:url(#m);} 
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="#8ea0b2"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900"/>
  <text class="title" x="40" y="60">Proyecto X — Esquema técnico (MVP)</text>
  <text class="muted" x="40" y="88">PocketBase = persistencia | KeyDB = sesiones + cache inteligente</text>

  <!-- Boxes -->
  <rect class="panel" x="60" y="140" width="300" height="140"/>
  <text class="h" x="86" y="175">Browser</text>
  <text class="t" x="86" y="200">UI: Vue + Pinia (JS)</text>
  <text class="t" x="86" y="222">Origen: http://localhost:8787</text>

  <rect class="panel" x="420" y="140" width="300" height="140"/>
  <text class="h" x="446" y="175">Caddy (:8787)</text>
  <text class="t" x="446" y="200">/ → web:5173</text>
  <text class="t" x="446" y="222">/api/* → api:8787</text>

  <rect class="panel" x="780" y="140" width="300" height="140"/>
  <text class="h" x="806" y="175">API (Hono + Bun)</text>
  <text class="t" x="806" y="200">Auth + sesiones</text>
  <text class="t" x="806" y="222">State GET/PUT</text>
  <text class="t" x="806" y="244">Import docs/links</text>

  <rect class="panel" x="780" y="340" width="300" height="170"/>
  <text class="h" x="806" y="375">PocketBase (:8090)</text>
  <text class="t" x="806" y="402">users (auth)</text>
  <text class="t" x="806" y="424">user_state (state JSON)</text>
  <text class="t" x="806" y="446">profile_imports (docs + links)</text>
  <text class="muted" x="806" y="476">Fuente de verdad</text>

  <rect class="panel" x="420" y="340" width="300" height="170"/>
  <text class="h" x="446" y="375">KeyDB (:6379)</text>
  <text class="t" x="446" y="402">px:sess:&lt;sid&gt; (TTL)</text>
  <text class="t" x="446" y="424">px:cache:state:user:&lt;userId&gt;</text>
  <text class="muted" x="446" y="476">Cache + sesiones</text>

  <!-- Arrows -->
  <path class="arrow" d="M360 210 L420 210"/>
  <path class="arrow" d="M720 210 L780 210"/>
  <path class="arrow" d="M930 280 L930 340"/>
  <path class="arrow" d="M780 245 C650 260 620 300 570 340"/>

  <!-- Flows -->
  <rect class="panel" x="60" y="560" width="1320" height="280"/>
  <text class="h" x="86" y="600">Flujos</text>
  <text class="t" x="86" y="628">1) Login: Web → POST /api/auth/login → API valida en PB → crea cookie sid (HttpOnly) + KeyDB px:sess:&lt;sid&gt;</text>
  <text class="t" x="86" y="656">2) State: GET /api/state: KeyDB cache → si miss → PB user_state. PUT /api/state: upsert en PB + refresca cache (TTL ~10m)</text>
  <text class="t" x="86" y="684">3) Import (candidato):</text>
  <text class="t" x="110" y="708">- POST /api/profile/imports/file (docType + file) → PB profile_imports (kind=document)</text>
  <text class="t" x="110" y="732">- POST /api/profile/imports/link (portfolio/behance/dribbble) → PB profile_imports</text>
  <text class="muted" x="86" y="780">Nota: UI “terminal minimalism”, 2 temas (terminal/light) vía variables CSS.</text>
</svg>
