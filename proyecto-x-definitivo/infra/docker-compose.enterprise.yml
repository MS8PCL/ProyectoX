services:
  keydb:
    image: eqalpha/keydb:latest
    container_name: proyecto-x-ent-keydb
    ports:
      - "6381:6379"
    command: ["keydb-server", "/etc/keydb/keydb.conf", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "keydb-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: proyecto-x-ent-pocketbase
    ports:
      - "8092:8090"
    environment:
      - PB_MAX_UPLOAD_SIZE=50MB
    volumes:
      - pb_data_ent:/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/_/"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: proyecto-x-ent-api
    depends_on:
      keydb:
        condition: service_healthy
      pocketbase:
        condition: service_healthy
    expose:
      - "8787"
    environment:
      PORT: "8787"
      WEB_ORIGIN: "http://localhost:8791"
      COOKIE_SECURE: "false"
      POCKETBASE_URL: "http://pocketbase:8090"
      KEYDB_URL: "redis://keydb:6379"
      SESSION_TTL_SECONDS: "86400"
      RATE_LIMIT_PER_MINUTE: "100"
      # Optional (needed for enterprise bootstrap/admin writes from API)
      PB_ADMIN_EMAIL: "${PB_ADMIN_EMAIL:-}"
      PB_ADMIN_PASSWORD: "${PB_ADMIN_PASSWORD:-}"

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: proyecto-x-ent-web
    expose:
      - "5173"

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: proyecto-x-ent-proxy
    depends_on:
      - api
      - web
    ports:
      - "8791:8787"

volumes:
  pb_data_ent:
